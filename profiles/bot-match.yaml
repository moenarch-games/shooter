schema_version: runtime-profiler/scenario/v1
# A scripted deathmatch without a window: six seeded bots and two scripted people for 5 1/2
# minutes of ticks (a full round, the intermission and the next round's start), hosted through
# game-server's MatchRuntime with replay capture. See docs/foundation-data.md.
id: shooter-bot-match-v1
target:
  type: command
  program: ./target/release/shooter-replay
  args: ["record", "--ticks", "20000"]
  working_directory: ..
run:
  warmup_iterations: 1
  measurement_iterations: 5
  timeout_seconds: 120
# native-perf waits on runtime-profiler#149 (Rust symbols with ';' break its call-path parser).
collectors:
  - process

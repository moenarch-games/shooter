schema_version: runtime-profiler/scenario/v1
# The browser client in headless Chromium: web/dist's profile run (?frames=120), 120 animation
# frames of a practice match at one tick each, slot 0 played by the replays' scripted person 0,
# in the profiler's 1280x720 viewport. Without a GPU, Chromium's WebGPU runs on SwiftShader.
# 120 frames (2 s of match) rather than the native 600: on SwiftShader render-engine's particle
# staging belt fails after about 200 frames (render-engine#108). Each frame is a
# `runtime-profiler:js-to-wasm:frame` User Timing measure. See docs/foundation-data.md.
id: shooter-web-client-v1
target:
  type: browser-journey
  module: scripts/profile-web-journey.mjs
  working_directory: ..
  inherit_env:
    - HOME
    - PLAYWRIGHT_BROWSERS_PATH
    - XDG_CACHE_HOME
    - SHOOTER_WEB_PROFILE_OUT
  # Only the WebGPU adapter is SwiftShader: with ANGLE on SwiftShader too
  # (--use-angle=swiftshader) the GPU process died on a hosted runner.
  browser_args:
    - --enable-unsafe-webgpu
    - --use-webgpu-adapter=swiftshader
    - --disable-gpu-watchdog
run:
  warmup_iterations: 0
  measurement_iterations: 1
  timeout_seconds: 300
collectors:
  - browser-chromium

name: Profile

# runtime-profiler bundles of the scripted bot match (plus its replay) and of the native client
# drawing a scripted match offscreen on lavapipe, as one artifact (docs/foundation-data.md).
# Evidence only: no thresholds, and merge-ready does not wait for it.

on:
  pull_request:
    paths:
      - "crates/**"
      - "profiles/**"
      - "scripts/profile.sh"
      - "Cargo.lock"
      - ".github/workflows/profile.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/validate-repo.yml@d6e2fe0d4f9decc88a0073a317cf3efbe12ee6d6
    with:
      bun_version: ""
      node_version: ""
      install_command: ""
      cache_bun: false
      cache_cargo: true
      # The client's audio (ALSA) and gamepads (udev); lavapipe (software Vulkan) draws it.
      apt_packages: libasound2-dev libudev-dev mesa-vulkan-drivers libvulkan1
      build_command: WGPU_FORCE_FALLBACK_ADAPTER=1 scripts/profile.sh target/profile
      artifact_paths: target/profile
      upload_artifacts_on: always
      artifact_name_suffix: -profile

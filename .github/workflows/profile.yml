name: Profile

# runtime-profiler bundles as artifacts (docs/foundation-data.md): the scripted bot match (plus
# its replay) and the native client drawing a scripted match offscreen on lavapipe; and the
# browser client's scripted match in headless Chromium on SwiftShader WebGPU.
# Evidence only: no thresholds, and merge-ready does not wait for it.

on:
  pull_request:
    paths:
      - "crates/**"
      - "profiles/**"
      - "scripts/**"
      - "web/**"
      - "package.json"
      - "bun.lock"
      - "Cargo.lock"
      - ".github/workflows/profile.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/validate-repo.yml@d6e2fe0d4f9decc88a0073a317cf3efbe12ee6d6
    with:
      bun_version: ""
      node_version: ""
      install_command: ""
      cache_bun: false
      cache_cargo: true
      # The client's audio (ALSA) and gamepads (udev); lavapipe (software Vulkan) draws it.
      apt_packages: libasound2-dev libudev-dev mesa-vulkan-drivers libvulkan1
      # native-perf (bot match) needs perf_event_paranoid <= 2; Ubuntu runners default to 4.
      build_command: |
        sudo sysctl -w kernel.perf_event_paranoid=1
        WGPU_FORCE_FALLBACK_ADAPTER=1 scripts/profile.sh target/profile native
      artifact_paths: target/profile
      upload_artifacts_on: always
      artifact_name_suffix: -profile
      concurrency_group: ${{ github.workflow }}-${{ github.ref }}-native

  web:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/validate-repo.yml@d6e2fe0d4f9decc88a0073a317cf3efbe12ee6d6
    with:
      # Node runs runtime-profiler's Playwright driver; Bun installs Playwright (package.json).
      node_version: "24"
      cache_cargo: true
      # The prebuilt wasm-bindgen CLI matching Cargo.lock, as pages.yml.
      pre_validate_command: |
        version="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)"
        name="wasm-bindgen-${version}-x86_64-unknown-linux-musl"
        curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${name}.tar.gz" | tar -xz -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/${name}" >> "$GITHUB_PATH"
      install_playwright: true
      install_playwright_browsers: chromium
      # After Playwright's Chromium is installed: builds web/dist and captures the browser run.
      e2e_command: scripts/profile.sh target/profile web
      artifact_paths: target/profile
      upload_artifacts_on: always
      artifact_name_suffix: -web-profile
      concurrency_group: ${{ github.workflow }}-${{ github.ref }}-web

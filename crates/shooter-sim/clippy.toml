# std's transcendental float functions call each platform's C library (glibc, the MSVC CRT,
# Apple's libm; compiler-builtins' musl port on wasm32), which differ in the last bit: native and
# browser builds of the simulation would drift apart (shooter#120). Use the `libm` crate's, which
# are the same code everywhere; `scripts/cross-build-hashes.sh` checks the result.
disallowed-methods = [
  { path = "f32::sin", reason = "platform libm: use libm::sinf (shooter#120)" },
  { path = "f32::cos", reason = "platform libm: use libm::cosf (shooter#120)" },
  { path = "f32::tan", reason = "platform libm: use libm::tanf (shooter#120)" },
  { path = "f32::sin_cos", reason = "platform libm: use libm::sincosf (shooter#120)" },
  { path = "f32::asin", reason = "platform libm: use libm::asinf (shooter#120)" },
  { path = "f32::acos", reason = "platform libm: use libm::acosf (shooter#120)" },
  { path = "f32::atan", reason = "platform libm: use libm::atanf (shooter#120)" },
  { path = "f32::atan2", reason = "platform libm: use libm::atan2f (shooter#120)" },
  { path = "f32::exp", reason = "platform libm: use libm::expf (shooter#120)" },
  { path = "f32::ln", reason = "platform libm: use libm::logf (shooter#120)" },
  { path = "f32::powf", reason = "platform libm: use libm::powf (shooter#120)" },
  { path = "f32::hypot", reason = "platform libm: use libm::hypotf (shooter#120)" },
  { path = "f32::cbrt", reason = "platform libm: use libm::cbrtf (shooter#120)" },
  { path = "f32::tanh", reason = "platform libm: use libm::tanhf (shooter#120)" },
  { path = "f64::sin", reason = "platform libm: use libm::sin (shooter#120)" },
  { path = "f64::cos", reason = "platform libm: use libm::cos (shooter#120)" },
  { path = "f64::tan", reason = "platform libm: use libm::tan (shooter#120)" },
  { path = "f64::sin_cos", reason = "platform libm: use libm::sincos (shooter#120)" },
  { path = "f64::asin", reason = "platform libm: use libm::asin (shooter#120)" },
  { path = "f64::acos", reason = "platform libm: use libm::acos (shooter#120)" },
  { path = "f64::atan", reason = "platform libm: use libm::atan (shooter#120)" },
  { path = "f64::atan2", reason = "platform libm: use libm::atan2 (shooter#120)" },
  { path = "f64::exp", reason = "platform libm: use libm::exp (shooter#120)" },
  { path = "f64::ln", reason = "platform libm: use libm::log (shooter#120)" },
  { path = "f64::powf", reason = "platform libm: use libm::pow (shooter#120)" },
  { path = "f64::hypot", reason = "platform libm: use libm::hypot (shooter#120)" },
  { path = "f64::cbrt", reason = "platform libm: use libm::cbrt (shooter#120)" },
  { path = "f64::tanh", reason = "platform libm: use libm::tanh (shooter#120)" },
]

[package]
name = "shooter-client"
description = "The shooter's client: native (wgpu) and browser (WebGPU, or WebGL 2 through its lite renderer; wasm32) from one crate, rendered by render-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shooter-sim.workspace = true
render-engine.workspace = true
input-bindings-core.workspace = true
# The lite renderer's vertex and uniform layouts (`gfx::lite`).
bytemuck = { version = "1.25.2", features = ["derive"] }
# The drawn UI's font (`ui`): glyphs rasterized into an atlas, metrics for layout.
fontdue = "0.9.5"
winit = "0.30.13"
gilrs = "0.11.2"
web-time = "1.1.0"
# The asset-tooling robot kit (crate::robots::kit): glTF read with the gltf crate, its KTX2 (Basis
# Universal) textures transcoded by basisu (pure Rust, so the browser build uses it too) and the
# bundle's content pins checked with sha2, as render-engine's kit_showcase and the mmorpg client.
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names", "allow_empty_texture"] }
basisu = "=0.1.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
# The main menu's map previews (`menu`): PNGs rendered from the real arenas
# (`--example arena_views -- MAP DIR thumbnail`), decoded into textures.
png = "0.18.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Linux builds need ALSA headers (libasound2-dev) for kira's cpal output.
game-audio = { workspace = true, features = ["kira"] }
pollster = "1.0.1"
game-server = { workspace = true, features = ["transport"] }
tokio.workspace = true
wtransport.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
game-audio = { workspace = true, features = ["web"] }
# Online play in the browser: game-server's BrowserSession over the page's WebTransport.
game-server = { workspace = true, features = ["browser-transport"] }
# The web build's wasm-bindgen CLI must match the wasm-bindgen in Cargo.lock (build-web.sh
# installs the matching one).
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
# The page timer between reconnect attempts; the profile run's result on `window`.
js-sys = "0.3"
web-sys = { version = "0.3", features = ["AbortSignal", "Document", "Element", "Headers", "HtmlElement", "Location", "Performance", "Request", "RequestInit", "Response", "Storage", "UrlSearchParams", "Window", "console"] }
console_error_panic_hook = "0.1.7"
# WebGL 2 beside WebGPU: the lite renderer where the browser has no WebGPU (`gfx::lite`). The same
# wgpu as render-engine's, so the feature reaches its instance.
wgpu = { version = "30.0.1", default-features = false, features = ["webgl"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
shooter-server = { path = "../shooter-server" }
# Self-signed identities let the online test host a real WebTransport match on loopback.
wtransport = { workspace = true, features = ["self-signed"] }

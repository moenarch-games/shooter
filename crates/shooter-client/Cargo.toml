[package]
name = "shooter-client"
description = "The shooter's client: native (wgpu) and browser (WebGPU, wasm32) from one crate, rendered by render-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shooter-sim.workspace = true
render-engine.workspace = true
input-bindings-core.workspace = true
winit = "0.30.13"
gilrs = "0.11.2"
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Linux builds need ALSA headers (libasound2-dev) for kira's cpal output.
game-audio = { workspace = true, features = ["kira"] }
pollster = "1.0.1"
game-server = { workspace = true, features = ["transport"] }
tokio.workspace = true
wtransport.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
game-audio = { workspace = true, features = ["web"] }
# Online play in the browser: game-server's BrowserSession over the page's WebTransport.
game-server = { workspace = true, features = ["browser-transport"] }
# The web build's wasm-bindgen CLI must match the wasm-bindgen in Cargo.lock (build-web.sh
# installs the matching one).
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
# The page timer between reconnect attempts; the profile run's result on `window`.
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "Location", "Performance", "UrlSearchParams", "Window", "console"] }
console_error_panic_hook = "0.1.7"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
shooter-server = { path = "../shooter-server" }
# Self-signed identities let the online test host a real WebTransport match on loopback.
wtransport = { workspace = true, features = ["self-signed"] }

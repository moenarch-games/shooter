[workspace]
members = ["crates/shooter-sim", "crates/shooter-server", "crates/shooter-client"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
shooter-sim = { path = "crates/shooter-sim" }
# The shared simulation floor (fixed-point tick maths, trig, the physics world over physics-engine
# with the Rapier A/B oracle behind `physics-ab`). It pins physics-engine and rapier3d itself.
sim-foundation = { git = "https://github.com/moenarch-games/mmorpg.git", rev = "eb58c43b5537dc3c156664f21cb5d5376d54be66" }
# Shared melee rules from the same mmorpg rev: swing reach, arc and height band (the energy blade).
sim-combat = { git = "https://github.com/moenarch-games/mmorpg.git", rev = "eb58c43b5537dc3c156664f21cb5d5376d54be66" }
render-engine = { git = "https://github.com/moritzbrantner/render-engine.git", rev = "9aadac9b5be5651f571c71836ff833c89a450202" }
input-bindings-core = { git = "https://github.com/moritzbrantner/input-bindings.git", rev = "561002ee94ab062f59c0d72dbca35b58734524dd" }
game-audio = { git = "https://github.com/moritzbrantner/game-audio.git", rev = "2643e342a7d071445186e421082acb553141811d" }
game-server = { git = "https://github.com/moritzbrantner/game-server.git", rev = "9fbaedc448c7d1be0c78f8b942cdfc8f84c1f442" }
# Native clients and the host binary only; game-server pins wtransport (and tokio) itself.
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
wtransport = { version = "=0.7.2", default-features = false, features = ["quinn", "ring"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Physics and rendering dependencies are optimized in dev and test builds: the movement tests and
# the A/B scenario spend their time inside the physics step.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"

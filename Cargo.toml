[workspace]
members = ["crates/shooter-sim", "crates/shooter-server", "crates/shooter-client"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
shooter-sim = { path = "crates/shooter-sim" }
# Physics (`shooter_sim::physics` adapts it); Rapier is the A/B oracle under `physics-ab` only and
# never ships in a client.
physics-engine = { git = "https://github.com/moritzbrantner/physics-engine", rev = "a7e04ef68eb6116565ea2731e4df8a47875d5248" }
rapier3d = "=0.36.1"
render-engine = { git = "https://github.com/moritzbrantner/render-engine.git", rev = "780e5d89d08de410a4d493204b5878a78293a006" }
input-bindings-core = { git = "https://github.com/moritzbrantner/input-bindings.git", rev = "561002ee94ab062f59c0d72dbca35b58734524dd" }
game-audio = { git = "https://github.com/moritzbrantner/game-audio.git", rev = "29739b442ee0ef3aedb61a82845645ceeb8c7342" }
# Default features off here: native crates enable `transport` (the host and wtransport), the
# browser build `browser-transport` (BrowserSession over the page's WebTransport).
game-server = { git = "https://github.com/moritzbrantner/game-server.git", rev = "0aba7cd370e6575a2524a80f5adc8dff0136f3a5", default-features = false }
# Native clients and the host binary only; game-server pins wtransport (and tokio) itself.
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
wtransport = { version = "=0.7.2", default-features = false, features = ["quinn", "ring"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Physics and rendering dependencies are optimized in dev and test builds: the movement tests and
# the A/B scenario spend their time inside the physics step.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"

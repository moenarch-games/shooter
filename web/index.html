<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>shooter</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #10131a;
        color: #e6e9ef;
        font: 15px/1.5 system-ui, sans-serif;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }
      /* winit appends the canvas last; the overlays stay above it. */
      #overlay,
      #crosshair,
      #error {
        z-index: 1;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgb(16 19 26 / 55%);
        pointer-events: none;
        text-align: center;
      }
      #overlay[hidden] {
        display: none;
      }
      #overlay strong {
        font-size: 22px;
        letter-spacing: 0.04em;
      }
      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 0 1px rgb(0 0 0 / 60%);
        pointer-events: none;
      }
      #error {
        display: none;
        position: fixed;
        inset: auto 16px 16px 16px;
        padding: 12px 16px;
        background: #5a1d1d;
        border-radius: 6px;
      }
      #error[data-shown] {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="crosshair"></div>
    <div id="overlay">
      <div>
        <strong>Click to play</strong><br />
        WASD or left stick to move · mouse or right stick to look · Space or A to jump · Esc to
        release the mouse
      </div>
    </div>
    <div id="error"></div>
    <script type="module">
      const overlay = document.getElementById("overlay");
      document.addEventListener("pointerlockchange", () => {
        overlay.hidden = document.pointerLockElement !== null;
      });
      if (!navigator.gpu) {
        const error = document.getElementById("error");
        error.textContent = "This browser has no WebGPU. Try a current Chrome, Edge, Firefox or Safari.";
        error.setAttribute("data-shown", "");
      }
      import init from "./shooter_client.js";
      await init();
    </script>
  </body>
</html>
